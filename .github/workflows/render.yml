name: render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  FILM: films/trailmark-ride
  SIZE: 1080x1920
  FPS: "30"

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "cache the headless browser"
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('package-lock.json') }}

      - name: "packages and the headless browser"
        run: |
          npm ci --no-audit --no-fund
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell

      - name: "look frames, so a broken page fails here and not after the whole film"
        run: node render/still.mjs $FILM 0.55 1.30 2.10 3.10 4.40 6.20 7.40 9.40 --size $SIZE --out out/stills

      - name: "picture: silent, so no audio pass and no mux"
        run: node render/video.mjs $FILM --fps $FPS --workers 4 --size $SIZE --out out/film.mp4

      - name: "probe"
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -show_entries format=duration,size -of default=nw=1 out/film.mp4 | tee probe.txt

      - name: "publish a public release, so the phone needs no login"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --title "Trailmark ride - $TAG" \
            --notes "10 s vertical film, 1080x1920, 30 fps, no audio. Style silhouette-rhythm. Made in code." \
            out/film.mp4 out/stills/*.jpg
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/film.mp4" >> "$GITHUB_STEP_SUMMARY"
