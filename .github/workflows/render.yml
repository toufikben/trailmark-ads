name: render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "packages and the headless browser"
        run: |
          npm install --no-audit --no-fund
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell

      - name: "python for the score"
        run: python -m pip install --quiet numpy scipy

      - name: "ffmpeg 7, because the runner ships 6.1"
        run: |
          curl -sL -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          /tmp/ff/ffmpeg -version | head -1
          echo "/tmp/ff" >> "$GITHUB_PATH"

      - name: "score and foley"
        run: python films/trailmark-dawn/audio.py

      - name: "stills, which also fail the run early if the page is broken"
        run: node render/still.mjs films/trailmark-dawn 0.55 1.30 2.60 3.35 3.95 4.55 5.60 6.40 7.75 --size 1080x1920 --out out/stills

      - name: "picture"
        run: node render/video.mjs films/trailmark-dawn --fps 30 --workers 4 --size 1080x1920 --out out/video.mp4

      - name: "master -14 LUFS, true peak under -1 dB, grain 1"
        run: sh render/mux.sh out/video.mp4 films/trailmark-dawn/out/mix.wav out/trailmark-dawn.mp4 30 1

      - name: "publish a public release, so the phone needs no login"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --title "Trailmark - $TAG" \
            --notes "8 s vertical test film, 1080x1920, 30 fps. Style silhouette-rhythm. Made in code." \
            out/trailmark-dawn.mp4 out/stills/*.jpg
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/trailmark-dawn.mp4" >> "$GITHUB_STEP_SUMMARY"
